<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'">
<title>Saved Locations map</title>
<link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="map.css">
</head>
<body>
<div id="map" role="application" aria-label="Saved Locations map. Drag to move. Click to choose a place."></div>
<div id="hint" role="status">Finding your current location…</div>
<button id="locate" title="Show my current location" aria-label="Show my current location">◎</button>
<button id="add" disabled title="Choose a place on the map first" aria-label="Add selected location"><img src="Add.svg" width="24" height="24" alt=""></button>
<script src="vendor/leaflet.js"></script><script src="map.js"></script>
</body>
</html>
